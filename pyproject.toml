[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biorxiv_agent"
version = "1.0.0"
description = "bioRxiv Intelligent Paper Agent"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
    "pymupdf>=1.23.0",
    "ollama>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0"]

[tool.setuptools.packages.find]
where = ["biorxiv_agent"]
include = ["*"]