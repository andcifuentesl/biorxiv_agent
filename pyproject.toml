[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biorxiv_agent"
version = "1.1.0"
description = "bioRxiv Intelligent Paper Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "pymupdf>=1.23.0",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black>=23.0"]

[project.scripts]
biorxiv-agent = "biorxiv_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biorxiv_agent*"]
